services:
  - type: web
    name: online-exam-system
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: TEACHER_USERNAME
        value: admin
      - key: TEACHER_PASSWORD
        generateValue: true
    healthCheckPath: /health
    autoDeploy: true
