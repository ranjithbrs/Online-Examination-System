spring.application.name=onlineexam

# Server Port (Render sets PORT env variable; defaults to 8080 locally)
server.port=${PORT:8080}

# Datasource configuration (MySQL profile: active when --spring.profiles.active=mysql)
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/examdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:root123}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable H2 Console in production MySQL profile
spring.h2.console.enabled=false
