spring.application.name=onlineexam

# Datasource configuration (MySQL profile: active when --spring.profiles.active=mysql)
spring.datasource.url=jdbc:mysql://localhost:3306/examdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable H2 Console in production MySQL profile
spring.h2.console.enabled=false
