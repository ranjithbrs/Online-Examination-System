spring.application.name=onlineexam

# Datasource configuration (Default: MySQL on localhost:3306 with fallback / H2 console)
spring.datasource.url=jdbc:mysql://localhost:3306/examdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console (Disabled by default, enabled when using H2 profile)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console