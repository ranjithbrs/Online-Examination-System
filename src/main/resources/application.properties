spring.application.name=onlineexam

# Server Port (Render sets PORT env variable; defaults to 8080 locally)
server.port=${PORT:8080}

# Datasource Configuration
# Defaults to H2 in-memory database for local runs, or connects to cloud MySQL (Railway / Aiven / RDS) when configured.
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:${MYSQL_URL:${DATABASE_URL:jdbc:h2:mem:examdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:${MYSQL_USER:sa}}}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:${MYSQL_PASSWORD:}}}}

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Hikari Connection Pool settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

# H2 Console (Enabled for local testing/monitoring)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true