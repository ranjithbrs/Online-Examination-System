spring.application.name=onlineexam

# Server Port (Render sets PORT env variable; defaults to 8080 locally)
server.port=${PORT:8080}

# Datasource Configuration
# Defaults to H2 in-memory database for zero-config startup on Render / locally.
# If cloud MySQL is configured via environment variables (DB_URL / SPRING_DATASOURCE_URL), it seamlessly connects.
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:h2:mem:examdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:sa}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

# JPA / Hibernate settings (Hibernate 6 auto-detects dialect from JDBC URL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console (Enabled for local testing/monitoring)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true